    .media-box { width: 100%; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid #e2e8f5; display: flex; justify-content: center; align-items: center; max-height: 260px; }

    .download-action-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 2px; }
    .action-btn { width: 100%; border-radius: 50px; padding: 14px 18px; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; transition: all 0.2s; box-shadow: 0 6px 15px -4px rgba(0,0,0,0.12); }
    .action-btn:hover { transform: translateY(-2px); }
    .btn-video { background: linear-gradient(135deg, #fe2c55 0%, #e01e43 100%); color: #fff; }
    .btn-audio { background: linear-gradient(135deg, #25f4ee 0%, #00d2cb 100%); color: #0f2b2a; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.2s, visibility 0.2s; }
    .modal-overlay.show { visibility: visible; opacity: 1; }
    
    .modal-card { background: #fff; max-width: 380px; width: 100%; border-radius: 32px; padding: 24px 20px; text-align: center; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.5); position: relative; display: flex; flex-direction: column; gap: 14px; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: #f0f3fa; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; font-weight: 600; color: #515168; cursor: pointer; z-index: 10; }
    
    @keyframes pulseZoom {
      0% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .countdown-number { font-size: 5rem; font-weight: 900; color: #fe2c55; line-height: 1; margin: 4px 0; animation: pulseZoom 0.8s infinite ease-in-out; text-shadow: 0 8px 20px rgba(254,44,85,0.3); }
    
    /* মোডালের ভেতরের অ্যাড স্পেস */
    .modal-ad-space { background: #f6f8fe; border: 2px dashed #cbd2e1; border-radius: 16px; width: 100%; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #82869b; font-size: 0.85rem; font-weight: 500; padding: 8px; overflow: hidden; }
    .modal-ad-space iframe { max-width: 100%; }

    .hidden { display: none !important; }
  </style>

  <script>
    (function() {
      const homePage = document.getElementById('homePage');
      const resultPage = document.getElementById('resultPage');
      const downloadTriggerBtn = document.getElementById('downloadTriggerBtn');
      const videoUrlInput = document.getElementById('videoUrlInput');
      const pasteBtn = document.getElementById('pasteBtn');

      const creatorNameEl = document.getElementById('creatorName');
      const creatorHandleEl = document.getElementById('creatorHandle');
      const descriptionTextEl = document.getElementById('descriptionText');
      const creatorAvatarEl = document.getElementById('creatorAvatar');
      const videoCoverImg = document.getElementById('videoCoverImg');

      const modalOverlay = document.getElementById('countdownModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const countdownDisplay = document.getElementById('countdownDisplay');

      const downloadVideoBtn = document.getElementById('downloadVideoBtn');
      const downloadAudioBtn = document.getElementById('downloadAudioBtn');

      let countdownInterval = null;
      let currentCountdown = 5;
      let currentVideoData = null;

      async function fetchTikTokData(tiktokUrl) {
        const apiUrl = 'https://www.tikwm.com/api/';
        const formData = new URLSearchParams();
        formData.append('url', tiktokUrl);
        formData.append('hd', '1');

        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-Requested-With': 'XMLHttpRequest'
            },
            body: formData
          });

          if (!response.ok) throw new Error('Network error');
          const json = await response.json();

          if (json.code !== 0 || !json.data) {
            throw new Error(json.msg || 'Invalid API response');
          }

          return json.data;
        } catch (error) {
          console.error('Fetch error:', error);
          return null;
        }
      }

      function updateResultPage(data) {
        if (!data) {
          creatorNameEl.textContent = 'ডেটা পাওয়া যায়নি';
          creatorHandleEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> লিংক সঠিক নয়`;
          descriptionTextEl.textContent = 'TikTok-এর ডেটা লোড করা যায়নি। সঠিক লিংক প্রদান করুন।';
          creatorAvatarEl.style.backgroundImage = 'none';
          videoCoverImg.src = '';
          return;
        }

        const author = data.author || {};
        const uniqueId = author.unique_id || 'unknown';
        const nickname = author.nickname || uniqueId;
        const avatarUrl = author.avatar || '';
        const coverUrl = data.cover || data.origin_cover || '';

        creatorNameEl.textContent = `@${uniqueId}`;
        creatorHandleEl.innerHTML = `<i class="fas fa-check-circle"></i> ${nickname}`;
        descriptionTextEl.textContent = data.title || 'কোনো ক্যাপশন নেই';
        
        if (coverUrl) {
          videoCoverImg.src = coverUrl;
        }

        if (avatarUrl) {
          creatorAvatarEl.style.backgroundImage = `url('${avatarUrl}')`;
          creatorAvatarEl.textContent = '';
        } else {
          creatorAvatarEl.style.backgroundImage = 'none';
          creatorAvatarEl.textContent = uniqueId.charAt(0).toUpperCase();
        }

        currentVideoData = {
          video: data.hdplay || data.play,
          audio: data.music
        };
      }

      function triggerDownload(url, filename) {
        if (!url) {
          alert('ডাউনলোড লিংক পাওয়া যায়নি।');
          return;
        }
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      pasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          videoUrlInput.value = text;
        } catch (err) {
          alert('ক্লিপবোর্ড থেকে পেস্ট করা সম্ভব হয়নি, ম্যানুয়ালি পেস্ট করুন।');
        }
      });

      downloadTriggerBtn.addEventListener('click', async () => {
        const url = videoUrlInput.value.trim();
        if (!url) {
          alert('অনুগ্রহ করে একটি TikTok লিংক পেস্ট করুন।');
          return;
        }

        homePage.classList.add('hidden');
        resultPage.classList.add('active');

        creatorNameEl.textContent = 'লোড হচ্ছে...';
        creatorHandleEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ডেটা আনা হচ্ছে`;
        descriptionTextEl.textContent = 'অনুগ্রহ করে অপেক্ষা করুন...';
        videoCoverImg.src = '';

        const data = await fetchTikTokData(url);
        updateResultPage(data);
      });

      function startDownloadProcess(type) {
        if (!currentVideoData) {
          alert('ভিডিও ডেটা পাওয়া যায়নি।');
          return;
        }

        const url = type === 'video' ? currentVideoData.video : currentVideoData.audio;
        const filename = `tiktok_${type}_${Date.now()}.${type === 'audio' ? 'mp3' : 'mp4'}`;

        startCountdown();

        setTimeout(() => {
          triggerDownload(url, filename);
        }, 5000);
      }

      downloadVideoBtn.addEventListener('click', () => startDownloadProcess('video'));
      downloadAudioBtn.addEventListener('click', () => startDownloadProcess('audio'));

      function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        currentCountdown = 5;
        countdownDisplay.textContent = currentCountdown;
        modalOverlay.classList.add('show');

        countdownInterval = setInterval(() => {
          currentCountdown -= 1;
          countdownDisplay.textContent = currentCountdown;

          if (currentCountdown <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            setTimeout(() => {
              modalOverlay.classList.remove('show');
            }, 300);
          }
        }, 1000);
      }

      function closeCountdownModal() {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        modalOverlay.classList.remove('show');
      }

      closeModalBtn.addEventListener('click', closeCountdownModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeCountdownModal();
      });
    })();
  </script>
